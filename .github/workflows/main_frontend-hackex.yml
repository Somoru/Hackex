# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - frontend-hackex

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - name: 🚀 Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: npm
          
      - name: 📦 Install Dependencies
        working-directory: frontend
        run: npm install

      - name: 🔨 Build Vite App
        working-directory: frotend
        run: npm run build
        
       - name: 🛠️ Move `server.js` to `dist/`
        run: mv frontend/server.js frontend/dist/

      - name: 🛠️ Ensure `package.json` is deployed
        run: cp frontend/package.json frontend/dist/

      - name: 🔍 Verify Build Output
        run: |
          echo "Listing frontend/dist directory..."
          ls -la frontend/dist

      - name: 📦 Zip Artifact for Deployment
        run: |
          cd frontend/dist
          zip -r ../../release.zip ./*

      - name: ⬆️ Upload Artifact for Deployment Job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: unzip release.zip
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_ED2F33819C374CC38AE20DB1CF9F5403 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6DF07351666E48759680045DB17AB152 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_22B9F24250464B47A92013C09D415EC1 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'frontend-hackex'
          slot-name: 'Production'
          package: .
          
