name: Deploy Vite App to Azure Web App - frontend-hackex

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies & Build
        run: |
          cd frontend
          npm install
          npm run build
          cp server.js dist/server.js  # Ensure server.js is inside the dist folder

      - name: Prepare Artifact for Deployment
        run: |
          cp -r frontend/dist/* .  # Copy all frontend build files to the root
          zip -r release.zip . -x "*.git*"

      - name: Upload Artifact for Deployment
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download Artifact from Build Job
        uses: actions/download-artifact@v4
        with:
          name: frontend-build

      - name: Unzip Artifact
        run: unzip release.zip -d .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2FC7394C77E846CFB6C4AACF5DDF6C02 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BEBD8C6C93BD4815A61462CD61486F55 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_32F714F936B34B209ABA3A70BECAA194 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'frontend-hackex'
          slot-name: 'Production'
          package: .
