<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>HackEx OTP</title>
  <style>
    body {
      background-color: #111827;
      font-family: 'Arial', sans-serif;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      background: rgba(30, 41, 59, 0.9);
      padding: 20px;
      margin: 20px auto;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
    }
    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #06b6d4;
      text-transform: uppercase;
    }
    .otp-box {
      font-size: 24px;
      font-weight: bold;
      color: #ffea00;
      padding: 10px 20px;
      background: rgba(255, 255, 0, 0.2);
      border-radius: 5px;
      display: inline-block;
      margin-top: 10px;
    }
    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #a1a1aa;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">HackEx Security Code</div>
    <p>Hey Coder,</p>
    <p>Your One-Time Password (OTP) for verification is:</p>
    <div class="otp-box">{{OTP}}</div>
    <p>This OTP is valid for 5 minutes. Do not share it with anyone.</p>
    <p>Happy Coding! 🚀</p>
    <div class="footer">© 2025 HackEx. All rights reserved.</div>
  </div>
</body>
</html>
