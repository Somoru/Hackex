<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Welcome to HackEx</title>
  <style>
    body {
      background-color: #111827;
      font-family: 'Arial', sans-serif;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 550px;
      background: rgba(30, 41, 59, 0.9);
      padding: 25px;
      margin: 20px auto;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
    }
    .logo {
      font-size: 32px;
      font-weight: bold;
      color: #06b6d4;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .message {
      font-size: 18px;
      line-height: 1.6;
      color: #e5e7eb;
    }
    .cta {
      margin-top: 20px;
    }
    .button {
      background: #06b6d4;
      padding: 12px 20px;
      border-radius: 6px;
      color: #000;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      display: inline-block;
      transition: 0.3s;
    }
    .button:hover {
      background: #0ea5e9;
    }
    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #a1a1aa;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Welcome to HackEx</div>
    <p class="message">Hey {{USER}},</p>
    <p class="message">You are now officially part of the **ultimate** coding experience. Get ready for intense challenges, insane problem-solving, and a chance to become the next coding legend! 🚀</p>
    <div class="cta">
      <a href="https://hackex.in/dashboard" class="button">Go to Dashboard</a>
    </div>
    <p class="footer">© 2025 HackEx. All rights reserved.</p>
  </div>
</body>
</html>
